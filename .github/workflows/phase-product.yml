name: phase-product
# stage:spec → product agent writes the spec → stage:design
# Transitions use the sdlc-orchestrator App token; GITHUB_TOKEN events never chain.

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: read

concurrency:
  group: product-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  CLAUDE_CODE_VERSION: "2.1.219"

jobs:
  spec:
    if: github.event.label.name == 'stage:spec'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ISSUE: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Mint orchestrator token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SDLC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          permission-issues: write

      - name: Loop guard
        run: |
          chmod +x scripts/*.sh
          scripts/loop_guard.sh "$ISSUE"

      - name: Gather context
        run: |
          mkdir -p context agent-out
          gh issue view "$ISSUE" --json number,title,body,labels,comments > context/issue.json

      - name: Product agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code@$CLAUDE_CODE_VERSION
          scripts/run_agent.sh product "/product:spec context/issue.json"

      - name: Render spec comment
        id: render
        run: |
          python3 - <<'EOF'
          import json, os, pathlib
          out = json.loads(pathlib.Path("agent-out/product-output.json").read_text())
          lines = ["<!-- sdlc:spec -->", "## 📋 Product spec (agent-generated)", "", out["spec_markdown"], "", "### Draft acceptance criteria"]
          lines += [f"- **{ac['id']}**: {ac['description']}" for ac in out["acceptance_criteria"]]
          questions = out["open_questions"]
          # Fail closed: a malformed question object parks rather than sails through.
          blocking = [q for q in questions if q.get("blocking", True)]
          if questions:
              lines += ["", "### Open questions"]
              lines += [f"- {'🚧 **BLOCKING** — ' if q.get('blocking', True) else ''}{q['question']}" for q in questions]
          lines += ["", f"_Estimated scope: {out['estimated_scope']}_"]
          if blocking:
              lines += ["", "---", "",
                        f"⛔ **Parked: {len(blocking)} blocking open question(s).** The design phase "
                        "would have to guess these answers, so the pipeline stops here instead of "
                        "racing you. Answer them in a comment (and edit the ticket if the scope "
                        "moves), then re-add `stage:spec` to re-run the product phase with your "
                        "answers in context."]
          pathlib.Path("agent-out/spec-comment.md").write_text("\n".join(lines))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"blocking={'true' if blocking else 'false'}\n")
          EOF
          { echo ""; cat agent-out/phase-cost.md; } >> agent-out/spec-comment.md

      - name: Transition → stage:design
        if: steps.render.outputs.blocking != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Clear a park left by a previous blocking-question run before advancing.
          scripts/transition.sh issue "$ISSUE" needs-human -
          scripts/transition.sh issue "$ISSUE" stage:spec stage:design agent-out/spec-comment.md

      - name: Park → needs-human (blocking open questions)
        if: steps.render.outputs.blocking == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: scripts/transition.sh issue "$ISSUE" stage:spec needs-human agent-out/spec-comment.md

      - name: Park on failure
        if: failure()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "⚠️ The product phase failed — see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Re-add \`stage:spec\` to retry." > park.md
          scripts/transition.sh issue "$ISSUE" stage:spec needs-human park.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-run-${{ github.event.issue.number }}-${{ github.run_id }}
          path: agent-out/
          if-no-files-found: ignore
