name: phase-dev
# Two entry points:
#   stage:dev on an issue  → implement: branch, code, tests, PR (Fixes #N), PR labeled qa-ready
#   qa-failed on a PR      → rework: fix findings on the PR branch, relabel qa-ready
# All pushes/PRs/labels use the App token so downstream workflows (ci, phase-qa) fire.

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

env:
  CLAUDE_CODE_VERSION: "2.1.219"

jobs:
  implement:
    if: github.event_name == 'issues' && github.event.label.name == 'stage:dev'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: dev-${{ github.event.issue.number }}
      cancel-in-progress: false
    env:
      ISSUE: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Mint orchestrator token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SDLC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Loop guard
        run: |
          chmod +x scripts/*.sh
          scripts/loop_guard.sh "$ISSUE"

      - name: Gather context and create branch
        id: branch
        run: |
          mkdir -p context agent-out
          gh issue view "$ISSUE" --json number,title,body,labels,comments > context/issue.json
          SLUG=$(gh issue view "$ISSUE" --json title --jq '.title' \
            | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-' | sed 's/^-//;s/-$//' | cut -c1-40)
          BRANCH="feature/${ISSUE}-${SLUG}"
          git config user.name "sdlc-orchestrator[bot]"
          git config user.email "sdlc-orchestrator[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v5

      - name: Install workspace (agent verifies with real test runs)
        run: uv sync --all-packages

      - name: Boot db + redis (so the dev agent can run DB-backed tests)
        run: docker compose up -d --wait --wait-timeout 90 db redis

      - name: Dev agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DATABASE_URL: postgresql+asyncpg://taskboard:taskboard@localhost:5432/taskboard_test
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: test
        run: |
          npm install -g @anthropic-ai/claude-code@$CLAUDE_CODE_VERSION
          scripts/run_agent.sh dev "/dev:implement context/issue.json"

      - name: Require commits
        run: |
          COUNT=$(git rev-list --count origin/main..HEAD)
          echo "agent made $COUNT commits"
          [ "$COUNT" -gt 0 ] || { echo "::error::dev agent produced no commits"; exit 1; }

      - name: Enforce privileged-path boundary
        # Deny rules steer the agent; this diff check is the hard stop. A
        # settings pattern bug once left the deny rules dead and rework edited
        # the QA charter — prose and permission flags are advisory, the diff
        # is not. Failure parks the ticket needs-human via Park on failure.
        run: |
          BAD=$(git diff --name-only origin/main...HEAD -- .github/ ci/claude/ scripts/)
          if [ -n "$BAD" ]; then
            echo "::error::agent commits touch pipeline-privileged paths (human-only):"
            echo "$BAD"
            exit 1
          fi

      - name: Push and open PR (labeled qa-ready)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git push origin "${{ steps.branch.outputs.branch }}"
          python3 - <<'EOF'
          import json, os, pathlib
          issue = os.environ["ISSUE"]
          report = json.loads(pathlib.Path("agent-out/dev-output.json").read_text())
          body = [f"Fixes #{issue}", "", report["summary"], "", "### Tests added"]
          body += [f"- `{t}`" for t in report["tests_added"]] or ["- none"]
          body += ["", "### Verification"] + [f"- {c}" for c in report["commands_run"]]
          if report["concerns"]:
              body += ["", "### Concerns for review"] + [f"- {c}" for c in report["concerns"]]
          pathlib.Path("agent-out/pr-body.md").write_text("\n".join(body))
          EOF
          TITLE=$(gh issue view "$ISSUE" --json title --jq '.title')
          gh pr create --base main --head "${{ steps.branch.outputs.branch }}" \
            --title "$TITLE" --body-file agent-out/pr-body.md
          gh pr edit "${{ steps.branch.outputs.branch }}" --add-label qa-ready

      - name: Transition issue → stage:qa
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PR_URL=$(gh pr view "${{ steps.branch.outputs.branch }}" --json url --jq '.url')
          echo "🔨 Implementation is up: $PR_URL — QA agent dispatched." > note.md
          scripts/transition.sh issue "$ISSUE" stage:dev stage:qa note.md

      - name: Park on failure
        if: failure()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "⚠️ The dev phase failed — see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Re-add \`stage:dev\` to retry." > park.md
          scripts/transition.sh issue "$ISSUE" stage:dev needs-human park.md || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev-run-${{ github.event.issue.number }}-${{ github.run_id }}
          path: agent-out/
          if-no-files-found: ignore

  rework:
    if: github.event_name == 'pull_request' && github.event.label.name == 'qa-failed'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: dev-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Refuse fork PRs
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Fork PRs are outside the automated pipeline."
          exit 1

      - name: Mint orchestrator token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SDLC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Loop guard (max 3 QA cycles)
        run: |
          chmod +x scripts/*.sh
          scripts/loop_guard.sh "$PR_NUMBER" '^qa-ready$' 3

      - name: Gather context (incl. QA verdict from the gate comment)
        run: |
          mkdir -p context agent-out
          gh pr view "$PR_NUMBER" --json number,title,body,files > context/pr.json
          ISSUE=$(gh pr view "$PR_NUMBER" --json body --jq '.body' \
            | grep -oiE '(fixes|closes|resolves) #[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
          if [ -n "$ISSUE" ]; then
            gh issue view "$ISSUE" --json number,title,body,comments > context/issue.json
          else
            echo '{"warning": "no linked issue"}' > context/issue.json
          fi
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate > context/pr-comments.json
          python3 - <<'EOF'
          import json, pathlib, re
          comments = json.loads(pathlib.Path("context/pr-comments.json").read_text())
          verdicts = [c["body"] for c in comments if "sdlc:qa-verdict" in c.get("body", "")]
          if not verdicts:
              raise SystemExit("no QA verdict comment found on PR")
          block = re.search(r"```json\n(.*?)```", verdicts[-1], re.S)
          data = json.loads(block.group(1))
          pathlib.Path("context/qa-verdict.json").write_text(json.dumps(data.get("verdict"), indent=2))
          EOF

      - uses: astral-sh/setup-uv@v5

      - name: Install workspace
        run: uv sync --all-packages

      - name: Boot db + redis (so the rework agent can run DB-backed tests)
        run: docker compose up -d --wait --wait-timeout 90 db redis

      - name: Rework agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DATABASE_URL: postgresql+asyncpg://taskboard:taskboard@localhost:5432/taskboard_test
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: test
        run: |
          git config user.name "sdlc-orchestrator[bot]"
          git config user.email "sdlc-orchestrator[bot]@users.noreply.github.com"
          npm install -g @anthropic-ai/claude-code@$CLAUDE_CODE_VERSION
          scripts/run_agent.sh dev "/dev:rework context"

      - name: Enforce privileged-path boundary
        # Same hard stop as the implement job, over this run's new commits only
        # (privileged commits already on the branch are the orchestrator's).
        run: |
          BAD=$(git diff --name-only "${{ github.event.pull_request.head.sha }}"..HEAD -- .github/ ci/claude/ scripts/)
          if [ -n "$BAD" ]; then
            echo "::error::agent commits touch pipeline-privileged paths (human-only):"
            echo "$BAD"
            exit 1
          fi

      - name: Require commits and push
        run: |
          COUNT=$(git rev-list --count "origin/${{ github.event.pull_request.head.ref }}"..HEAD)
          echo "agent made $COUNT commits"
          [ "$COUNT" -gt 0 ] || { echo "::error::rework agent produced no commits"; exit 1; }
          git push origin "${{ github.event.pull_request.head.ref }}"

      - name: Transition PR → qa-ready
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: scripts/transition.sh pr "$PR_NUMBER" qa-failed qa-ready

      - name: Park on failure
        if: failure()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "⚠️ Rework failed — see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Re-add \`qa-failed\` to retry." > park.md
          scripts/transition.sh pr "$PR_NUMBER" qa-failed needs-human park.md || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rework-run-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: agent-out/
          if-no-files-found: ignore
