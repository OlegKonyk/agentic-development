name: assistant
# Interactive @claude mentions on issues and PRs (tag mode, claude-code-action).
# Not part of the state machine — a human convenience channel.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  id-token: write

jobs:
  claude:
    # Three conditions, not one. The mention alone is not enough:
    #   * Bot-authored comments are excluded so the pipeline cannot chain into
    #     this workflow — phase comments are posted with the App token (whose
    #     events are NOT suppressed), and agent prose can contain anything,
    #     including the literal string '@claude'.
    #   * author_association gates the repo: this is a PUBLIC repository, and
    #     without the check any GitHub user could start a 30-turn agent run
    #     with contents/issues/pull-requests write on the owner's subscription.
    if: >-
      contains(github.event.comment.body, '@claude')
      && github.event.comment.user.type != 'Bot'
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 30"
