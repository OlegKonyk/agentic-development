[project]
name = "taskboard-qa"
version = "0.1.0"
description = "QA harness: E2E and contract test suites for the taskboard"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-playwright>=0.5",
    "pytest-rerunfailures>=14",
    "schemathesis>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qa_helpers"]
