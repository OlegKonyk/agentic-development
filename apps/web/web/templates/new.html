{% extends "base.html" %}
{% block title %}New task — Taskboard{% endblock %}
{% block content %}
<h2>New task</h2>
<form class="stacked" method="post" action="/new">
  <input type="hidden" name="csrf_token" value="{{ csrf }}">
  <label for="title">Title</label>
  <input id="title" name="title" required maxlength="200"
         data-testid="title-input" value="{{ title | default('') }}">
  <label for="description">Description</label>
  <textarea id="description" name="description" rows="4"
            data-testid="description-input">{{ description | default('') }}</textarea>
  <label for="due_at">Due (optional)</label>
  <input id="due_at" name="due_at" type="datetime-local"
         data-testid="due-at-input" value="{{ due_at | default('') }}">
  <p><button type="submit" class="btn-primary" data-testid="submit-task">Create task</button></p>
</form>
{% endblock %}
