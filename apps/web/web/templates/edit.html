{% extends "base.html" %}
{% block title %}Edit task — Taskboard{% endblock %}
{% block content %}
<h2>Edit task</h2>
<form class="stacked" method="post" action="/tasks/{{ task_id }}/edit">
  <input type="hidden" name="csrf_token" value="{{ csrf }}">
  <input type="hidden" name="status" value="{{ status }}">
  <input type="hidden" name="q" value="{{ search | default('') }}">
  <input type="hidden" name="page" value="{{ page }}">
  <label for="title">Title</label>
  <input id="title" name="title" required maxlength="200"
         data-testid="title-input" value="{{ title | default('') }}">
  <label for="description">Description</label>
  <textarea id="description" name="description" rows="4"
            data-testid="description-input">{{ description | default('') }}</textarea>
  <label for="due_at">Due (optional)</label>
  <input id="due_at" name="due_at" type="datetime-local"
         data-testid="due-at-input" aria-describedby="due-at-zone"
         value="{{ due_at | default('') }}">
  <p class="field-hint" id="due-at-zone" data-testid="due-at-zone">
    Times are in {{ tz_name }}. Leave empty to remove the due date.
  </p>
  <p>
    <button type="submit" class="btn-primary" data-testid="submit-edit">Save changes</button>
    <a href="{{ board_url }}" data-testid="edit-cancel">Cancel</a>
  </p>
</form>
{% endblock %}
