<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Taskboard{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #172b4d; }
    header { background: #172b4d; color: #fff; padding: 0.75rem 1.5rem; display: flex;
             align-items: center; gap: 1rem; }
    header h1 { font-size: 1.1rem; margin: 0; }
    header a { color: #9cc2ff; text-decoration: none; }
    main { padding: 1.5rem; max-width: 64rem; margin: 0 auto; }
    .banner-error { background: #ffebe6; border: 1px solid #ff8f73; color: #bf2600;
                    padding: 0.75rem 1rem; border-radius: 4px; margin-bottom: 1rem; }
    .board { display: flex; gap: 1rem; align-items: flex-start; }
    .column { background: #ebecf0; border-radius: 4px; padding: 0.75rem; flex: 1; }
    .column h2 { font-size: 0.85rem; text-transform: uppercase; margin: 0 0 0.5rem;
                 color: #5e6c84; }
    .task { background: #fff; border-radius: 4px; padding: 0.6rem 0.75rem; margin-bottom: 0.5rem;
            box-shadow: 0 1px 1px rgba(9, 30, 66, 0.25); }
    .task .title { font-weight: 600; }
    .task .status { font-size: 0.75rem; color: #5e6c84; }
    .task .actions { margin-top: 0.4rem; display: flex; gap: 0.4rem; }
    .task .actions form { display: inline; }
    button { border: 0; border-radius: 3px; padding: 0.25rem 0.6rem; cursor: pointer;
             font-size: 0.8rem; }
    .btn-advance { background: #0052cc; color: #fff; }
    .btn-delete { background: #ffebe6; color: #bf2600; }
    .btn-primary { background: #0052cc; color: #fff; padding: 0.45rem 1rem; font-size: 0.9rem; }
    form.stacked label { display: block; margin: 0.75rem 0 0.25rem; font-weight: 600; }
    form.stacked input, form.stacked textarea { width: 100%; padding: 0.4rem;
      border: 1px solid #dfe1e6; border-radius: 3px; font: inherit; }
  </style>
</head>
<body>
  <header>
    <h1><a href="/" style="color:#fff">Taskboard</a></h1>
    <a href="/new" data-testid="new-task-link">+ New task</a>
  </header>
  <main>
    {% if api_error %}
    <div class="banner-error" data-testid="api-error">
      The task API is unavailable. Please try again shortly.
    </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
