[project]
name = "taskboard-web"
version = "0.1.0"
description = "Taskboard server-rendered UI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "anyio>=4.0",
    "httpx>=0.27",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["web"]
