[project]
name = "taskboard-api"
version = "0.2.0"
description = "Taskboard FastAPI JSON API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "greenlet>=3",
    "alembic>=1.14",
    "taskiq>=0.11",
    "taskiq-redis>=1.0",
    "taskiq-fastapi>=0.3",
    "tenacity>=9",
    "pwdlib[argon2]>=0.2",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio>=4",
    "httpx>=0.27",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
