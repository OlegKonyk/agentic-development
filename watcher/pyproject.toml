[project]
name = "sdlc-watcher"
version = "0.1.0"
description = "SDK twin of the CI pipeline: polls phase labels and dispatches Claude agent runs"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "httpx>=0.27",
]

[project.scripts]
sdlc-watcher = "sdlc_watcher.main:cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdlc_watcher"]
